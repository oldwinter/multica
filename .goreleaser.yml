version: 2

project_name: multica

builds:
  - id: multica
    main: ./cmd/multica
    dir: server
    binary: multica
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Legacy archive name kept so already-released CLIs (whose `multica update`
  # looks for `multica_{os}_{arch}.{ext}`) can keep self-updating. Remove
  # once those versions are no longer in use.
  - id: legacy
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Versioned archive name used by current CLI / install scripts /
  # desktop bootstrap going forward.
  - id: versioned
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Suffix tags (for example v0.4.32-oldwinter.2) are downstream prereleases.
# GoReleaser defaults to stable releases unless this is explicitly enabled.
release:
  prerelease: auto

brews:
  - name: multica
    ids:
      - versioned
    repository:
      owner: multica-ai
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Fork releases still publish CLI archives to their own GitHub Release,
    # but must never attempt to write to the canonical upstream tap. The
    # Actions runtime always exports GITHUB_REPOSITORY_OWNER; an unset value
    # also skips the upload, which keeps local/snapshot runs fail-safe.
    skip_upload: '{{ ne .Env.GITHUB_REPOSITORY_OWNER "multica-ai" }}'
    directory: Formula
    homepage: "https://github.com/multica-ai/multica"
    description: "Multica CLI — local agent runtime and management tool for the Multica platform"
    # No license stanza: Multica ships under the Multica License (Apache 2.0
    # terms with additional conditions, see LICENSE), which has no SPDX
    # identifier, so declaring "Apache-2.0" here would be a false claim.
    install: |
      bin.install "multica"
    test: |
      system "#{bin}/multica", "version"
